# .github/workflows/release.yml
#
# Triggered when you push a git tag like v1.0.0
#   git tag v1.0.0 && git push origin v1.0.0
#
# What it does:
#   1. Builds ytd.exe (standalone portable, with ffmpeg and custom icon)
#   2. Builds ytd-setup.exe (Windows Setup Wizard installer using Inno Setup)
#   3. Publishes both executables to your GitHub Releases page

name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Installers & Publish Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install yt-dlp pyinstaller pillow pywin32
          choco install innosetup -y

      - name: Convert PNG icon to ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('assets/ytd_icon.png').convert('RGBA')
          sizes = [(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          frames = [img.resize(s, Image.LANCZOS) for s in sizes]
          frames[0].save('assets/ytd_icon.ico', format='ICO', sizes=sizes, append_images=frames[1:])
          print('ICO ready')
          "

      - name: Setup ffmpeg for bundling
        run: |
          $ffmpegCmd = Get-Command ffmpeg -ErrorAction SilentlyContinue
          if ($ffmpegCmd) {
            Copy-Item $ffmpegCmd.Source -Destination "assets\ffmpeg.exe"
            Write-Host "ffmpeg found in runner and copied to assets/"
          } else {
            choco install ffmpeg -y
            $newFfmpeg = Get-Command ffmpeg
            Copy-Item $newFfmpeg.Source -Destination "assets\ffmpeg.exe"
            Write-Host "ffmpeg installed via choco and copied to assets/"
          }

      - name: Build standalone ytd.exe
        run: |
          python -m PyInstaller `
            --onefile `
            --noconsole `
            --name ytd `
            --icon assets/ytd_icon.ico `
            "--add-data=assets;assets" `
            "--add-binary=assets/ffmpeg.exe;." `
            --hidden-import ytd.gui `
            --hidden-import ytd.cli `
            --hidden-import ytd.shortcut `
            --hidden-import ytd.ffmpeg_utils `
            --hidden-import win32com `
            --hidden-import win32com.client `
            --hidden-import win32com.shell `
            --hidden-import pythoncom `
            ytd/cli.py

      - name: Build Windows Setup Wizard (ytd-setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ytd.exe
            dist/ytd-setup.exe
            install.ps1
          generate_release_notes: true
