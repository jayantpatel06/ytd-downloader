[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ytd-downloader"
version = "1.0.0"
description = "A simple YouTube / multi-site video downloader with both a GUI and a CLI, powered by yt-dlp."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["youtube", "downloader", "yt-dlp", "video", "gui", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: X11 Applications",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "yt-dlp>=2024.1.1",
]

# Windows-only optional dep for desktop shortcut creation
[project.optional-dependencies]
windows = [
    "pywin32; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/ytd-downloader"
"Bug Reports" = "https://github.com/YOUR_USERNAME/ytd-downloader/issues"
Source = "https://github.com/YOUR_USERNAME/ytd-downloader"

[project.scripts]
ytd = "ytd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytd*"]

[tool.setuptools.package-data]
ytd = ["../assets/*.png", "../assets/*.ico"]

